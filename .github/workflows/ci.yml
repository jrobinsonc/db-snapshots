name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Type check, format check and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Test on the minimum Bun version the package supports, taken from
      # the `engines.bun` range in package.json (e.g. ">=1.4.4" -> "1.4.4").
      - name: Resolve minimum Bun version
        id: bun-version
        run: |
          range=$(jq -r '.engines.bun // empty' package.json)
          version=$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+' <<<"$range" | head -n1)
          if [ -z "$version" ]; then
            echo "::error file=package.json::Could not read a Bun version from engines.bun ('$range')"
            exit 1
          fi
          echo "Using Bun $version (engines.bun: $range)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.bun-version.outputs.version }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun check

      - name: Format check
        run: bun fmt --check

      - name: Tests
        run: bun test
