name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Type check, format check and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Bun and install dependencies
        uses: ./.github/actions/setup-bun

      - name: Type check
        run: bun check

      - name: Format check
        run: bun fmt --check

      - name: Tests
        run: bun test --coverage --coverage-reporter=text --coverage-reporter=lcov

      - name: SonarQube Cloud Scan
        if: github.ref_type != 'tag'
        uses: SonarSource/sonarqube-scan-action@70bad232163b09d998ea0707ee80c0ec80798c16 # v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
