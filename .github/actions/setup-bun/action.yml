name: Setup Bun
description: Resolve the minimum Bun version from package.json, set up Bun, and install dependencies.

runs:
  using: composite
  steps:
    # Test and build on the minimum Bun version the package supports, taken from
    # the `engines.bun` range in package.json (e.g. ">=1.4.4" -> "1.4.4").
    - name: Resolve minimum Bun version
      id: bun-version
      shell: bash
      run: |
        range=$(jq -r '.engines.bun // empty' package.json)
        version=$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+' <<<"$range" | head -n1)
        if [ -z "$version" ]; then
          echo "::error file=package.json::Could not read a Bun version from engines.bun ('$range')"
          exit 1
        fi
        echo "Using Bun $version (engines.bun: $range)"
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: ${{ steps.bun-version.outputs.version }}

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile
